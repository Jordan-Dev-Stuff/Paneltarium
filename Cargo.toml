[workspace]
resolver = "3"
members = [
    "crates/pt-core",
    "crates/pt-platform",
    "crates/pt-gamepad",
    "crates/pt-brand",
    "crates/paneltarium",
    "crates/paneltarium-app",
    "crates/paneltarium-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = ""

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
pt-platform = { path = "crates/pt-platform" }
pt-gamepad = { path = "crates/pt-gamepad" }
pt-brand = { path = "crates/pt-brand" }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

# Background app (hotkeys, tray, event loop)
ab_glyph = "0.2"
egui-phosphor = { version = "0.14", default-features = false }
epaint_default_fonts = "0.36"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.9"
notify = "8"
raw-window-handle = "0.6"
# SDL 3, compiled from source and linked statically (needs CMake), with only
# the controller parts: no audio, video, GPU or rendering. "Console build"
# lets it build on Linux without X11/Wayland headers, which it doesn't need.
sdl3-sys = { version = "0.7.3", default-features = false, features = [
    "build-from-source-static",
    "no-default-subsystems",
    "sdl-joystick",
    "sdl-hidapi",
    "sdl-unix-console-build",
    "sdl-lean-and-mean",
] }
softbuffer = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
winresource = { version = "0.1", default-features = false }
winit = "0.30"

# Windows-only bindings (used by pt-platform's windows module)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# Dev / test
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
# Small, fast binaries: whole-program optimisation, no debug symbols.
lto = true
codegen-units = 1
strip = true
